<style>
:root{--accent:#2f8f5b;--accent-dark:#237044;--accent-light:#e0f2e8;--bg:#f5f7f5;--surface:#fff;--surface-2:#edf2ee;--text:#172019;--muted:#68736c;--border:#dbe2dd;--shadow:0 16px 45px rgba(20,35,25,.10);--header-height:78px}
html[data-theme="dark"]{--bg:#101411;--surface:#181d19;--surface-2:#202720;--text:#eef4ef;--muted:#a6b0a8;--border:#303a32;--shadow:0 16px 50px rgba(0,0,0,.40)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-y:scroll}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);line-height:1.6;transition:background .25s ease,color .25s ease;overflow-x:hidden}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
.site-header{position:fixed;top:0;left:0;width:100%;z-index:1000;height:var(--header-height);background:var(--accent);border-bottom:1px solid var(--accent-dark);box-shadow:0 7px 25px rgba(0,0,0,.10);transition:height .25s ease,box-shadow .25s ease}
.site-header:hover{height:117px;box-shadow:0 12px 35px rgba(0,0,0,.16)}
.header-inner{width:min(1180px,calc(100% - 28px));height:100%;margin:auto;display:flex;align-items:center;gap:14px}

.layout{width:min(1180px,calc(100% - 28px));padding:calc(var(--header-height) + 28px) 0 30px;margin:auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);transition:background .25s ease,border-color .25s ease,box-shadow .25s ease}
.download-card{margin-top:0;margin-bottom:24px;padding:22px;text-align:center}
.download-title{margin:0;font-size:34px;font-weight:850;letter-spacing:-.025em;line-height:1.15}
.download-text{margin:10px auto 18px;color:var(--muted);font-size:15px;max-width:700px}
.download-link{display:inline-block;border-radius:13px;padding:10px 17px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.07);transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.download-link:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.10);background:var(--accent-dark)}
@media(max-width:900px){.site-header:hover{height:117px}.download-card{padding:17px}}
@media(max-width:600px){.header-inner{width:calc(100% - 18px);gap:8px}.header-title{font-size:1.12rem}.download-card{padding:14px}.download-title{font-size:29px}}
</style>
<script>

document.documentElement.lang=localStorage.getItem("gollum-language")||"de";
</script>
</head>
<body>
<header class="site-header">

</div>
</header>

<a class="download-link" id="downloadLink" href="downloadFlaggenpixeln.exe" download>Download-Link</a>
</section>
</main>
<script>
const translations={de:{title:"Flaggenpixeln Download",downloadTitle:"Download",downloadText:"Für die beste Spielerfahrung lade dir das Spiel mit meinem eigenen Launcher herunter.",downloadLink:"Download-Link"},en:{title:"Flag Pixeling Download",downloadTitle:"Download",downloadText:"For the best playing experience, download the game with my own launcher.",downloadLink:"Download-Link"}};
const currentLanguage=localStorage.getItem("gollum-language")||"de";
const t=k=>translations[currentLanguage][k]??k;

document.getElementById("headerTitle").textContent=t("title");
document.getElementById("downloadTitle").textContent=t("downloadTitle");
document.getElementById("downloadText").textContent=t("downloadText");
document.getElementById("downloadLink").textContent=t("downloadLink");
</script>
</body>
</html>
